services:
  # ============================================================================
  # MySQL 8.0 Database Service
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: bus-mgmt-db
    restart: unless-stopped
    command: ["mysqld", "--port=3307"]
    environment:
      MYSQL_ROOT_PASSWORD: "root@6069"
      MYSQL_DATABASE: "bus_reservation"
    ports:
      - "3307:3307"
    volumes:
      - ./lib/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-u", "root", "-proot@6069"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - bus-network

  # ============================================================================
  # Bus Management Application (Java Swing UI accessible via Browser)
  # Accessible at: http://localhost:6969
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus-mgmt-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3307
      DB_NAME: bus_reservation
      DB_USER: root
      DB_PASSWORD: "root@6069"
      PORT: 6969
      RESOLUTION: "1280x800x24"
    ports:
      - "6969:6969"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bus-network

networks:
  bus-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
